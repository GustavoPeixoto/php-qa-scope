; Common settings for the PHP package development environment.
; Loaded after the official profile and before development overrides.
; After editing INI files, rebuild the image and recreate the container.
[PHP]
default_charset = "UTF-8"
memory_limit = 512M
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2

[Date]
date.timezone = UTC
