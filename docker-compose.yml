name: ${PROJECT_NAME}

services:
  dev:
    image: ${PROJECT_NAME}-dev:latest
    build:
      dockerfile: ./docker/dev/Dockerfile
      context: .
      args:
        WORKSPACE_DIR: ${WORKSPACE_DIR}
    env_file:
      - ./docker/dev/.env
    volumes:
      - type: bind
        source: ${HOST_WORKSPACE_DIR:-.}
        target: ${WORKSPACE_DIR}
        consistency: consistent
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: ${WORKSPACE_DIR}
    # Codex uses bubblewrap for sandboxing; Docker's default seccomp blocks unshare/namespaces in the Dev Container.
    security_opt:
      - seccomp=unconfined

  php:
    image: ${PROJECT_NAME}-php:latest
    build:
      dockerfile: ./docker/php/Dockerfile
      context: .
      target: development
      args:
        WORKSPACE_DIR: ${WORKSPACE_DIR}
    env_file:
      - ./docker/php/.env
    volumes:
      - type: bind
        source: ${HOST_WORKSPACE_DIR:-.}
        target: ${WORKSPACE_DIR}
        consistency: cached
    working_dir: ${WORKSPACE_DIR}
