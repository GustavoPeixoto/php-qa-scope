name: Pull request QA

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: QA (${{ matrix.check }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [qa-scope, sniffer, fixer, md, stan, test, openspec]
    env:
      CHECK_ID: ${{ matrix.check }}
      REVISION: ${{ github.sha }}
      TOOLING_FAMILY: ${{ matrix.check == 'openspec' && 'node' || 'php' }}
      TOOLING_DOCKERFILE: ${{ matrix.check == 'openspec' && 'docker/dev/Dockerfile' || 'docker/php/Dockerfile' }}
    steps:
      - name: Checkout proposed integration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare cache keys
        id: cache_keys
        shell: bash
        env:
          TOOLING_KEY: pr-qa-tooling-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.TOOLING_FAMILY }}-${{ hashFiles(env.TOOLING_DOCKERFILE) }}
          COMPOSER_PREFIX: pr-qa-composer-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docker/php/Dockerfile') }}-
          COMPOSER_INPUTS: ${{ hashFiles('composer.json', 'composer.lock') }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr-qa-cache" "logs/pr-qa/results/$CHECK_ID"
          printf 'CACHE_ROOT=%s/pr-qa-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'tooling=%s\ncomposer=%s%s\ncomposer-prefix=%s\n' \
            "$TOOLING_KEY" "$COMPOSER_PREFIX" "$COMPOSER_INPUTS" "$COMPOSER_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          cache-binary: false

      - name: Restore tooling layers
        id: tooling_cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CACHE_ROOT }}/tooling
          key: ${{ steps.cache_keys.outputs.tooling }}

      - name: Build shared tooling
        shell: bash
        run: |
          cache_from=()
          if [ -f "$CACHE_ROOT/tooling/index.json" ]; then
            cache_from=(--cache-from "type=local,src=$CACHE_ROOT/tooling")
          fi
          docker buildx build --file "$TOOLING_DOCKERFILE" --target tooling --tag pr-qa-tooling . \
            --load --progress plain "${cache_from[@]}" \
            --cache-to "type=local,dest=$CACHE_ROOT/tooling-next,mode=max" \
            2>&1 | tee "logs/pr-qa/results/$CHECK_ID/build.log"
          rm -rf "$CACHE_ROOT/tooling"
          mv "$CACHE_ROOT/tooling-next" "$CACHE_ROOT/tooling"

      - name: Save tooling layers
        if: steps.tooling_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CACHE_ROOT }}/tooling
          key: ${{ steps.cache_keys.outputs.tooling }}

      - name: Restore Composer downloads
        id: composer_cache
        if: matrix.check != 'openspec'
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CACHE_ROOT }}/composer
          key: ${{ steps.cache_keys.outputs.composer }}
          restore-keys: ${{ steps.cache_keys.outputs.composer-prefix }}

      - name: Install locked PHP development dependencies
        if: matrix.check != 'openspec'
        shell: bash
        run: |
          mkdir -p "$CACHE_ROOT/composer"
          docker run --rm --init --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,mode=1777 --env HOME=/tmp --env COMPOSER_HOME=/tmp/composer \
            --env COMPOSER_CACHE_DIR=/composer-cache \
            --mount "type=bind,source=$CACHE_ROOT/composer,target=/composer-cache" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" pr-qa-tooling \
            composer install --no-interaction --no-ansi --prefer-dist --no-progress \
            2>&1 | tee "logs/pr-qa/results/$CHECK_ID/install.log"

      - name: Save Composer downloads
        if: matrix.check != 'openspec' && steps.composer_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CACHE_ROOT }}/composer
          key: ${{ steps.cache_keys.outputs.composer }}

      - name: Run native validation
        run: python3 -B tools/pr-qa --check "$CHECK_ID" --image pr-qa-tooling --revision "$REVISION"

      - name: Retain available QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-${{ matrix.check }}
          if-no-files-found: error
          path: |
            logs/pr-qa/results/${{ matrix.check }}/
            logs/pr-qa/outcomes/${{ matrix.check }}.json
