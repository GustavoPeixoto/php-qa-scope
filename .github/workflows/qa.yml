name: Pull request QA

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: QA (${{ matrix.check }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [qa-scope, sniffer, fixer, md, stan, test, openspec]
    env:
      CHECK_ID: ${{ matrix.check }}
      REVISION: ${{ github.sha }}
    steps:
      - name: Checkout proposed integration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build shared tooling
        shell: bash
        run: |
          mkdir -p "logs/pr-qa/results/$CHECK_ID"
          if [ "$CHECK_ID" = openspec ]; then
            dockerfile=docker/dev/Dockerfile
          else
            dockerfile=docker/php/Dockerfile
          fi
          docker build --file "$dockerfile" --target tooling --tag pr-qa-tooling . \
            2>&1 | tee "logs/pr-qa/results/$CHECK_ID/build.log"

      - name: Install locked PHP development dependencies
        if: matrix.check != 'openspec'
        shell: bash
        run: |
          docker run --rm --init --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,mode=1777 --env HOME=/tmp --env COMPOSER_HOME=/tmp/composer \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" pr-qa-tooling \
            composer install --no-interaction --no-ansi --prefer-dist --no-progress \
            2>&1 | tee "logs/pr-qa/results/$CHECK_ID/install.log"

      - name: Run native validation
        run: python3 -B tools/pr-qa --check "$CHECK_ID" --image pr-qa-tooling --revision "$REVISION"

      - name: Retain available QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-${{ matrix.check }}
          if-no-files-found: error
          path: |
            logs/pr-qa/results/${{ matrix.check }}/
            logs/pr-qa/outcomes/${{ matrix.check }}.json
