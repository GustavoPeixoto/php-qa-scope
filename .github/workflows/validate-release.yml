name: Validate release

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Release Branch
    if: startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-24.04
    concurrency:
      group: validate-release-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check release origin
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        shell: python
        run: |
          import os
          import sys
          if os.environ['HEAD_REPOSITORY'] != os.environ['GITHUB_REPOSITORY']:
              sys.exit('Release origin must be the same repository')

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Build shared PHP and Composer tooling
        run: docker build --file docker/php/Dockerfile --target tooling --tag php-qa-scope-release-tooling .

      - name: Validate manifest and lock
        run: >-
          docker run --rm
          --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly"
          --workdir /workspace php-qa-scope-release-tooling
          composer --no-plugins --no-scripts validate --strict --no-check-version

      - name: Validate release contract
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: python3 -B tools/release/validate.py
