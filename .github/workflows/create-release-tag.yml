name: Create release tag

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Merged Release
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-24.04
    concurrency:
      group: validate-merged-release-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Build shared PHP and Composer tooling
        run: docker build --file docker/php/Dockerfile --target tooling --tag php-qa-scope-release-tooling .

      - name: Validate integrated manifest and lock
        run: >-
          docker run --rm
          --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly"
          --workdir /workspace php-qa-scope-release-tooling
          composer --no-plugins --no-scripts validate --strict --no-check-version

      - name: Validate integrated release contract
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: python3 -B tools/release/validate.py

  publish:
    name: Publish protected release tag
    needs: validate
    permissions:
      contents: read
      pull-requests: read # Re-read merged PR identity and eligibility through the API.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-24.04
    concurrency:
      group: protected-release-publication
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Recheck current publication authority
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B tools/release/authority.py

      - name: Generate repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Create immutable lightweight release ref
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.authority.outputs.tag }}
          MERGE_SHA: ${{ steps.authority.outputs.sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$MERGE_SHA"
